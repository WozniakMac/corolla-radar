services:
  corolla-radar:
    image: ghcr.io/wozniakmac/corolla-radar:latest
    container_name: corolla-radar
    restart: unless-stopped
    ports:
      - "4174:4174"
    environment:
      HOST: 0.0.0.0
      PORT: 4174
      CHROMIUM_SANDBOX: ${CHROMIUM_SANDBOX:-false}
      ENABLE_SCHEDULED_SCAN: "true"
      SCAN_INTERVAL_MINUTES: 240
      ENABLE_CEPIK: "true"
      CEPIK_INTERVAL_SECONDS: 300
      SNAPSHOT_RETENTION_DAYS: 90
      SNAPSHOT_VERSIONS_PER_URL: 5
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-high}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      NODE_USE_ENV_PROXY: ${NODE_USE_ENV_PROXY:-1}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      NTFY_URL: ${NTFY_URL:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://192.168.2.47:4174}
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4174/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
