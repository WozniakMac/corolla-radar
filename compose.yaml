services:
  corolla-radar:
    image: ghcr.io/wozniakmac/corolla-radar:latest
    container_name: corolla-radar
    restart: unless-stopped
    ports:
      - "4174:4174"
    environment:
      HOST: 0.0.0.0
      PORT: 4174
      ENABLE_SCHEDULED_SCAN: "true"
      SCAN_INTERVAL_MINUTES: 240
      ENABLE_CEPIK: "true"
      CEPIK_INTERVAL_SECONDS: 300
      SNAPSHOT_RETENTION_DAYS: 90
      SNAPSHOT_VERSIONS_PER_URL: 5
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NTFY_URL: ${NTFY_URL:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://192.168.2.47:4174}
      APP_USERNAME: ${APP_USERNAME:?Ustaw APP_USERNAME w pliku .env}
      APP_PASSWORD: ${APP_PASSWORD:?Ustaw APP_PASSWORD w pliku .env}
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4174/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
